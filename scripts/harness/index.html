<!doctype html><html><head><meta charset="utf-8"><title>CanadaFirst popup harness</title>
<style>body{margin:0;background:#ddd;padding:20px;font-family:sans-serif}iframe{width:320px;height:700px;border:0;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2)}#opened{margin-top:10px;font-size:12px;word-break:break-all}</style></head>
<body><iframe id="f"></iframe><div id="opened"></div>
<script>
const result = { domain: "boutiquelocale.ca", url: "https://www.boutiquelocale.ca/", entry: null, source: "cache-negative", verdict: { verdict: "UNKNOWN", country: null, province: null, badgeText: "?", badgeColor: "#D1D5DB", label: "Unknown", foreignOwned: false, ownerCountry: null, ownerName: null } };
window.__mock = {
  runtime: { lastError: null, getManifest: () => ({ version: "0.1.0" }),
    sendMessage: (msg, cb) => { setTimeout(() => cb({ ok: true, data: msg.type === "GET_VERDICT" ? result : { ok: true } }), 10); },
    openOptionsPage: () => {} },
  tabs: { create: async ({ url }) => { document.getElementById("opened").textContent = "tabs.create → " + url; } },
};
fetch("/src/popup/popup.html").then(r => r.text()).then(html => {
  const doc = html
    .replace("<head>", `<head><base href="${location.origin}/src/popup/">`)
    .replace('<script type="module" src="popup.js">', '<script>globalThis.chrome = parent.__mock;<\/script><script type="module" src="popup.js">');
  document.getElementById("f").srcdoc = doc;
});
</script></body></html>
